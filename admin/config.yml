backend:
  name: git-gateway
  branch: main

media_folder: "images/listings"
public_folder: "/images/listings"

collections:
  - name: "properties"
    label: "Biens immobiliers"
    files:
      - file: "content/properties.json"
        label: "Catalogue des biens"
        name: "properties"
        fields:
          - label: "Biens"
            name: "properties"
            widget: "list"
            summary: "{{title}} — {{tag}}"
            fields:
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "À louer", value: "location" }
                  - { label: "À vendre", value: "vente" }
                  - { label: "Gestion", value: "gestion" }
              - { label: "Étiquette affichée", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Prix (texte libre, ex: \"850 000 GNF/mois\")", name: "price", widget: "string" }
              - { label: "Surface (ex: \"150 m²\")", name: "surface", widget: "string", required: false }
              - { label: "Nombre de chambres / pièces", name: "chambres", widget: "string", required: false }
              - { label: "Équipements (ex: \"Cour clôturée, eau, électricité\")", name: "equipements", widget: "string", required: false }
              - label: "Photos (la première est utilisée comme vignette)"
                name: "photos"
                widget: "list"
                field: { label: "Photo", name: "image", widget: "image" }
